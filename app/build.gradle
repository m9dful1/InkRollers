plugins { 
    id 'com.android.application'
    id 'kotlin-android' 
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}
android {
  namespace 'com.spiritwisestudios.inkrollers'
  compileSdk 34
  defaultConfig { 
      applicationId 'com.spiritwisestudios.inkrollers' 
      minSdk 26
      targetSdk 34 
      versionCode 3
      versionName "1.0.1" 
      testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  buildTypes {
      release {
          minifyEnabled true
          proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
          signingConfig signingConfigs.debug
      }
  }
  kotlinOptions { jvmTarget='1.8' }
  buildFeatures {
      compose true
      viewBinding true
  }
  composeOptions {
      kotlinCompilerExtensionVersion '1.5.8'
  }
  testOptions {
      unitTests {
          includeAndroidResources = true
          returnDefaultValues = true
          all {
              jvmArgs '-Dnet.bytebuddy.experimental=true'
          }
      }
  }
}
dependencies {
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
  implementation 'androidx.core:core-ktx:1.12.0'
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
  
  // Hilt for Dependency Injection
  implementation "com.google.dagger:hilt-android:2.51.1"
  kapt "com.google.dagger:hilt-compiler:2.51.1"

  // ViewModel and LiveData
  implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3"
  implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.3"
  implementation "androidx.activity:activity-ktx:1.9.0"
  implementation "androidx.fragment:fragment-ktx:1.8.1"

  // Import the BoM for Firebase platform versions
  implementation platform('com.google.firebase:firebase-bom:33.1.2') // Updated BoM version slightly
  
  // Jetpack Compose BoM
  implementation platform('androidx.compose:compose-bom:2024.06.00')

  // Declare Firebase product dependencies without versions
  implementation 'com.google.firebase:firebase-database-ktx' 
  // implementation 'com.google.firebase:firebase-database-ktx:21.0.0' // REMOVED: Duplicate and overrides BoM
  // implementation 'com.google.firebase:firebase-analytics' // REMOVED: Not needed for DB MVP
  implementation 'com.google.firebase:firebase-auth-ktx' // Rely on BoM for version
  implementation 'com.google.firebase:firebase-crashlytics-ktx'
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.firebase:firebase-appcheck-ktx:18.0.0'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity:18.0.0'

    // Jetpack Compose Runtime Dependencies
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'com.google.firebase:firebase-appcheck-debug:18.0.0'
    
    // JSON serialization for game state persistence
    implementation 'com.google.code.gson:gson:2.10.1'

  // Testing
  testImplementation 'junit:junit:4.13.2'
  testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
  testImplementation 'org.mockito:mockito-core:5.1.1'
  testImplementation 'org.mockito:mockito-inline:5.1.1'
  testImplementation 'androidx.test:core:1.5.0'
  testImplementation 'androidx.test.ext:junit:1.1.5'
  testImplementation 'org.robolectric:robolectric:4.10.3'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
  androidTestImplementation 'androidx.test:runner:1.6.1'
  androidTestImplementation 'androidx.test:rules:1.6.1'
  androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
  implementation 'androidx.test.espresso:espresso-idling-resource:3.6.1'
  androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'

  // Coroutines
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'

  // App Startup - Ensure it is available for both main app and tests
  implementation 'androidx.startup:startup-runtime:1.1.1'
}
